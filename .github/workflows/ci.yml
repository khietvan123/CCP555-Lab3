name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: fragments/package-lock.json
      - run: npm ci
      - run: npm run lint

# Lint our Dockerfile using Hadolint
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository
      - uses: actions/checkout@v4

      # Run Hadolint GitHub Action
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: fragments/Dockerfile

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: fragments/package-lock.json
      - run: npm ci
      - run: npm test
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fragments
    services:
      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
          DEBUG: 1
          DATA_DIR: /tmp/localstack/data
          DOCKER_HOST: unix:///var/run/docker.sock
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 4566:4566
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: fragments/package-lock.json
      - run: npm ci
      - name: Start fragments service
        run: npm start &
        env:
          LOG_LEVEL: debug
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DYNAMODB_TABLE_NAME: fragments
          AWS_DYNAMODB_ENDPOINT_URL: http://localhost:8000
          AWS_S3_BUCKET_NAME: fragments
          AWS_S3_ENDPOINT_URL: http://localhost:4566
      - name: Wait for service to start
        run: sleep 5
      - name: Setup AWS resources (S3 bucket and DynamoDB table)
        run: |
          npx aws s3api create-bucket --bucket fragments --endpoint-url http://localhost:4566 --region us-east-1 || true
          npx aws dynamodb create-table \
            --table-name fragments \
            --attribute-definitions AttributeName=ownerId,AttributeType=S AttributeName=id,AttributeType=S \
            --key-schema AttributeName=ownerId,KeyType=HASH AttributeName=id,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url http://localhost:8000 \
            --region us-east-1 || true
      - name: Wait for resources
        run: sleep 2
      - name: Run integration tests
        run: npx hurl --test --glob "tests/integration/**/*.hurl"
  
  docker-hub:
    name: Build and Push to Docker Hub
    # Run this only if all other jobs succeed
    needs: [lint, dockerfile-lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - uses: actions/checkout@v4

      # Set up Docker Buildx (enables multi-platform caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to Docker Hub using secrets
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the image
      - name: Build and push
        env:
          DOCKERHUB_REPO: khietvan123/fragments
          SHA_TAG: sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: ./fragments
          file: ./fragments/Dockerfile 
          push: true
          # Tag with commit SHA, main, and latest
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ env.SHA_TAG }},
            ${{ env.DOCKERHUB_REPO }}:main,
            ${{ env.DOCKERHUB_REPO }}:latest

